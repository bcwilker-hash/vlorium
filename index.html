  :root { --ink:#414a42; --sage:#8fa396; --sage-dark:#5a6b60; --gold:#dfd1a8; --bg:#fbfaf6; }
  * { box-sizing:border-box; margin:0; }
  body { min-height:100vh; display:flex; flex-direction:column; justify-content:center; padding:48px 24px;
         background:var(--bg); color:var(--ink); font:18px/1.6 Georgia, "Times New Roman", serif; }
  main { max-width:760px; margin:0 auto; width:100%; }
  .mark { font:600 14px/1 system-ui, sans-serif; letter-spacing:.3em; text-transform:uppercase; color:var(--sage-dark); }
  .rule { width:56px; height:2px; background:var(--gold); margin:28px 0; }
  h1 { font-weight:400; font-size:clamp(36px, 6vw, 64px); line-height:1.1; }
  h1 span { color:var(--sage-dark); }
  p { margin-top:24px; max-width:520px; font-size:20px; }
  footer { max-width:760px; margin:64px auto 0; width:100%; font:14px system-ui, sans-serif; color:var(--sage-dark); }
</style>
</head>

<main>
  <div class="mark">VLorium</div>
  <div class="rule"></div>
  <h1>Built for your business.<br><span>Ready for this new era.</span></h1>
